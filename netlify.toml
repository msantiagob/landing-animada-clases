# Configuración de Netlify. La guía de despliegue y las variables de entorno están en NETLIFY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Las dependencias de Netlify (@netlify/*) piden Node >= 22.12; "22" toma la última 22.x.
  NODE_VERSION = "22"

# Cabeceras de seguridad para lo que Netlify sirve como archivo (el blog prerenderizado y
# los assets). Netlify NO las aplica a las respuestas de una función, que son casi todo el
# sitio y la API: esas las pone el middleware (src/middleware.ts). Los dos lados salen de
# src/lib/security-headers.ts y tests/netlify-config.test.ts comprueba que coincidan.
#
# Ojo: NO agregar acá una regla `/*  /index.html  200`. Es el parche típico de las SPA y
# aquí convertiría cada URL inexistente en un 200 con la portada (soft 404), lo que Search
# Console penaliza. Los 404 reales los resuelve la página src/pages/404.astro.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
